name: DB migrace (Supabase)

# Ruční nasazení vybraných souborů ze supabase/migrations/ do živé DB přes psql.
#
# Proč ne `supabase db push`: pět migrací sdílí verzi 20260724 a starší se aplikovaly
# ručně přes SQL editor, takže tabulka schema_migrations neodpovídá souborům — CLI by
# je zkoušelo pustit znovu. Tenhle workflow dělá přesně to, co se dnes dělá ručně:
# pustí zadané soubory v daném pořadí, v jedné transakci, se zastavením na první chybě.
#
# Potřebuje JEDEN repo secret: SUPABASE_DB_URL = connection string k živé DB
#   (Supabase → projekt → Connect → „Session pooler", tvar
#    postgresql://postgres.<ref>:<HESLO>@aws-0-<region>.pooler.supabase.com:5432/postgres).
#   Heslo je heslo databáze (Settings → Database), ne anon/service klíč. Nikam do repa.
#
# Výchozí běh je DRY RUN: migrace se provedou a na konci se odvolají (ROLLBACK),
# takže je vidět, že projdou, a v DB se nic nezmění. Ostrý běh = odškrtnout dry_run.
# URL se nikdy netiskne — psql ji nevypisuje ani při chybě.
#
# ⚠️ BEZPEČNOST (nález Codexu na #14): vstup `files` se NIKDY nevkládá do těla skriptu
# přes ${{ }}. Takový zápis GitHub expanduje ještě před spuštěním bashe, takže kdo smí
# workflow pustit, mohl podstrčit `$(...)` a příkaz by běžel dřív než kontroly — s
# SUPABASE_DB_URL v prostředí. Vstup proto chodí proměnnou prostředí a čte se jako DATA;
# každá cesta musí projít striktním vzorem (jeden segment, jen [A-Za-z0-9._-], .sql).

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Soubory migrací v pořadí, oddělené mezerou (jen názvy v supabase/migrations/)'
        type: string
        required: true
        default: 'supabase/migrations/20260908100100_vr_album_bucket.sql supabase/migrations/20260908100200_vr_msglog_idx_cleanup.sql'
      dry_run:
        description: 'Jen vyzkoušet (na konci ROLLBACK), nic nezapsat'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ověřit vstup a sestavit dávku
        env:
          FILES: ${{ inputs.files }}      # DATA, ne kód — viz hlavička
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          set -f                          # žádné globování nad seznamem cest
          : > /tmp/batch.sql
          echo 'begin;' >> /tmp/batch.sql
          n=0
          for f in $FILES; do
            printf '%s\n' "$f" | grep -qE '^supabase/migrations/[A-Za-z0-9._-]+\.sql$' || {
              echo "::error::Nepovolená cesta (čekám supabase/migrations/<název>.sql): $f"; exit 1; }
            [ -f "$f" ] || { echo "::error::Soubor neexistuje: $f"; exit 1; }
            printf '\\echo === %s\n\\i %s\n' "$f" "$f" >> /tmp/batch.sql
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo '::error::Nezadán žádný soubor.'; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            printf 'rollback;\n\\echo === DRY RUN: vse odvolano (ROLLBACK), DB nezmenena\n' >> /tmp/batch.sql
          else
            printf 'commit;\n\\echo === COMMIT: migrace zapsany\n' >> /tmp/batch.sql
          fi
          echo "Souborů: $n, dry run: $DRY_RUN"
          cat /tmp/batch.sql

      - name: Spustit psql
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo '::error::Chybí repo secret SUPABASE_DB_URL (viz hlavička workflow).'; exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -q -f /tmp/batch.sql
